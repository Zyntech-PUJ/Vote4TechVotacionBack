# docker-compose para levantar VotacionBack en la VM 10.43.100.131
# en el puerto 8081 como contenedor Docker.
#
# Uso:
#   docker compose -f docker/docker-compose.prod.yml up -d --build
#
# Para ver logs:
#   docker logs vote4tech-votacion-back --follow
#
# IMPORTANTE: antes de levantar, editar las variables de entorno de este
# archivo con los valores correctos (especialmente CORS_ALLOWED_ORIGINS
# con el URL real de Cloudflare una vez obtenido).
# PREREQUISITO: PostgreSQL y CouchDB deben estar corriendo en 10.43.101.13.

services:
  votacion-back:
    build:
      context: ..            # raiz del repo Vote4TechVotacionBack
      dockerfile: Dockerfile
    image: vote4tech-votacion-back:latest
    container_name: vote4tech-votacion-back
    ports:
      - "8081:8081"
    environment:
      # Base de datos PostgreSQL (VM de BDs: 10.43.101.13)
      DB_URL: jdbc:postgresql://10.43.101.13:5432/bd_nacional_vote4tech
      DB_USER: admin_db_nacional
      DB_PASSWORD: "12345"
      # CORS: VotacionFront corre en el puerto 4201 del mismo VM de frontends
      # Reemplazar CLOUDFLARE_URL con el URL real obtenido del tunel
      CORS_ALLOWED_ORIGINS: "http://10.43.97.237:4201,https://adware-planets-oriented-ecommerce.trycloudflare.com"
      # CouchDB (VM de BDs: 10.43.101.13)
      COUCHDB_URL: http://10.43.101.13:5984
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: admin123
      COUCHDB_DB_URNA: votos_urna
      COUCHDB_DB_DOMICILIO: votos_domicilio
    restart: unless-stopped
