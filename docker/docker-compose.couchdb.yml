# docker-compose para levantar CouchDB en la VM del backend (10.43.100.131).
# Solo gestiona CouchDB; el VotacionBack corre directamente con Maven.
#
# Primera vez:
#   docker compose -f docker/docker-compose.couchdb.yml up -d
#
# Para ver logs:
#   docker logs vote4tech-couchdb

services:
  couchdb:
    image: couchdb:3
    container_name: vote4tech-couchdb
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: admin123
    ports:
      - "5984:5984"
    volumes:
      - couchdb_data:/opt/couchdb/data
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: vote4tech-cloudflared-couchdb
    command: tunnel --no-autoupdate --url http://localhost:5984
    network_mode: host
    depends_on:
      - couchdb
    restart: unless-stopped
    # Ver URL publica: docker logs vote4tech-cloudflared-couchdb 2>&1 | grep trycloudflare

volumes:
  couchdb_data:
