spring.application.name=PortalVotacionBack

# Puerto (configurable)
server.port=${PORT:8081}

# ======================
# DATABASE (mismo PostgreSQL que Registraduria)
# ======================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ======================
# CORS
# ======================
config.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ======================
# COUCHDB
# ======================
couchdb.url=${COUCHDB_URL:http://localhost:5984}
couchdb.username=${COUCHDB_USER:admin}
couchdb.password=${COUCHDB_PASSWORD:admin}
couchdb.database.urna=${COUCHDB_DB_URNA:votos_urna}
couchdb.database.domicilio=${COUCHDB_DB_DOMICILIO:votos_domicilio}

# ======================
# ACTUATOR
# ======================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ======================
# LOGGING
# ======================
logging.level.org.springframework=${LOG_LEVEL:INFO}
